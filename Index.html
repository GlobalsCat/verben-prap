<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verb-Präposition-Kartei</title>
<style>
:root{--bg:#ebe3cf;--card:#f0e9d6;--btn:#e6dfc8;--ink:#1f2433;--red:#9b2c2c;--ok:#2f6b3f;--mute:#6b6a60}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px) 0 0/5px 5px;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
.m{font-family:"Courier New",monospace}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;gap:16px;align-items:center}
.stamp{width:72px;height:72px;border:3px dashed var(--red);border-radius:50%;display:grid;place-items:center;color:var(--red);font-weight:700;font-size:17px;flex:none}
h1{font-size:27px;margin:0;line-height:1.1}
header p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.stats{display:flex;margin:18px 0 0;border-top:1px solid var(--mute);border-bottom:1px solid var(--mute);padding:12px 0}
.stats div{flex:1;text-align:center}
.stats div+div{border-left:1px solid var(--mute)}
.stats b{display:block;font-size:26px}
.stats span{font-size:13px}
.sub{display:flex;justify-content:space-between;font-size:13px;margin:12px 0 16px}
.tabs{display:flex;gap:12px;margin-bottom:18px}
.tabs button{flex:1;padding:16px 8px;font-size:15px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
select{width:100%;padding:13px 10px;font:inherit;font-size:15px;background:var(--btn);border:1px solid var(--ink);color:var(--ink)}
.card{border:2px solid var(--ink);padding:6px;box-shadow:6px 6px 0 rgba(0,0,0,.08)}
.in{border:1px solid var(--ink);background:var(--card);padding:20px 18px 18px}
.lab{font-size:13px;color:var(--mute);letter-spacing:.1em}
.verb{font-size:32px;margin:18px 0 6px;min-height:46px}
.blank{display:inline-block;min-width:80px;border-bottom:3px dashed var(--ink);margin-left:12px;text-align:center;font-size:30px;color:var(--ok)}
.hint{font-size:14px;color:var(--mute);min-height:20px;margin-bottom:12px}.example{font-size:16px;line-height:1.45;margin:10px 0 16px;padding:10px 12px;border-left:3px solid var(--ink);background:rgba(0,0,0,.035)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts button{padding:18px 6px;font-size:20px;border:1px solid var(--ink);background:var(--btn);color:var(--ink);cursor:pointer}
.opts button:focus-visible,.next:focus-visible,.tabs button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.bad{background:var(--red);color:#fff;border-color:var(--red)}
.opts button:disabled{cursor:default}
.fb{min-height:56px;margin:18px 0 6px;font-size:17px}
.next{width:100%;padding:16px;font-size:17px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.next:disabled{background:#aaa99d;cursor:default}
.reset{margin-top:22px;background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px;cursor:pointer}
@media(prefers-reduced-motion:no-preference){.opts button{transition:background .15s}}
</style>
</head>
<body>
<main>
<header>
  <div class="stamp m">V+P</div>
  <div><h1>Verb-Präposition-Kartei</h1><p class="m">Feste Präpositionen üben</p></div>
</header>
<div class="stats m">
  <div><b id="xp">0</b><span>XP</span></div>
  <div><b id="streak">0</b><span>Serie (Tage)</span></div>
  <div><b id="total">0</b><span>Aktiv</span></div>
</div>
<div class="sub m"><span id="sNew"></span><span id="sLearn"></span><span id="sMast"></span></div>
<div class="tabs m">
  <button id="tAll" class="on">Alle Verben</button>
  <button id="tBad">Nur ✗ falsche</button>
</div>
<div class="m" style="margin:-6px 0 18px"><select id="typ" aria-label="Typ"><option value="all">Alle Verben</option></select></div>
<section class="card"><div class="in">
  <div class="lab m" id="lab"></div>
  <div class="verb"><span id="verb"></span><span class="blank m" id="blank">&nbsp;</span></div>
  <div class="hint m" id="hint"></div><div class="example" id="example"></div>
  <div class="opts m" id="opts"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <button class="next m" id="next" disabled>Nächste Karte →</button>
</div></section>
<button class="reset m" id="reset">Fortschritt zurücksetzen</button>
</main>
<script>
// Format: Wort|Präposition|Kasus (A/D/AD)|weitere richtige Präpositionen (optional)
const RV=`achten|auf|A;ankommen|auf|A;sich anpassen|an|A;antworten|auf|A;sich ärgern|über|A;aufpassen|auf|A;ausgeben|für|A;sich bedanken|für|AD|bei;sich begeistern|für|A;sich beklagen|über|AD|bei;berichten|über|AD|von;sich beschweren|über|AD|bei,um;sich bewerben|auf|AD|um,bei;sich beziehen|auf|A;bitten|um|A;danken|für|A;denken|an|A;diskutieren|über|AD|mit;eingehen|auf|A;sich einigen|auf|A;sich einsetzen|für|A;sich engagieren|für|A|gegen;sich entscheiden|für|A|gegen;sich entschuldigen|für|AD|bei;(sich) erinnern|an|A;erzählen|über|AD|von;sich freuen (Zukunft)|auf|A;sich freuen (Gegenwart)|über|A;sich gewöhnen|an|A;glauben|an|A;halten|für|AD|von;sich halten|an|A;es handelt sich|um|A;hinweisen|auf|A;hoffen|auf|A;(sich) informieren|über|A;sich interessieren|für|A;investieren|in|A;kämpfen|für|AD|gegen,um,mit;sich konzentrieren|auf|A;sich kümmern|um|A;lachen|über|A;nachdenken|über|A;reagieren|auf|A;reden|über|A;schimpfen|über|AD|mit;sorgen|für|A;sich sorgen|um|A;sich spezialisieren|auf|A;sprechen|über|AD|mit,von;speichern|auf|A;(sich) streiten|über|AD|um,mit;sich unterhalten|über|AD|mit;sich verlassen|auf|A;sich verlieben|in|A;verzichten|auf|A;sich vorbereiten|auf|A;warten|auf|A;sich wenden|an|A;werben|für|A;sich wundern|über|A;gratulieren|zu|D;handeln|mit|D|von;helfen|bei|D;hören|von|D;klarkommen|mit|D;klingen|nach|D;leiden|an|D|unter;liegen|an|D;sich melden|bei|D;motivieren|zu|D;nachfragen|bei|D;sich orientieren|an|D;passen|zu|D;raten|zu|D;(sich) retten|vor|D;sich richten|nach|D;schmecken|nach|D;sterben|an|D;teilnehmen|an|D;telefonieren|mit|D;träumen|von|D;sich treffen|mit|D;(sich) trennen|von|D;überreden|zu|D;überzeugen|von|D;umgehen|mit|D;unterbrechen|bei|D;sich unterscheiden|von|D;unterstützen|bei|D;sich verabreden|mit|D;sich verabschieden|von|D;verbinden|mit|D;vergleichen|mit|D;verlangen|von|D;(sich) verstecken|vor|D;sich verstehen|mit|D;vorbeikommen|bei|D;vorkommen|bei|D;vortragen|vor|D;weglaufen|vor|D;sich wünschen|von|D;zurückkommen|von|D;zählen|zu|D;zweifeln|an|D;zwingen|zu|D;abhalten|von|D;abhängen|von|D;sich abmelden|von|D;abraten|von|D;ändern|an|D;anfangen|mit|D;anrufen|bei|D;arbeiten|an|D|bei,in;aufhören|mit|D;ausgehen|von|D;sich auskennen|mit|D;sich austauschen|mit|D;sich befassen|mit|D;sich befinden|in|D;beginnen|mit|D;beitragen|zu|D;bestehen|aus|D;bestellen|bei|D;sich beteiligen|an|D;bringen|zu|D;einladen|zu|D;sich entschließen|zu|D;erhalten|von|D;sich erholen|von|D;erkennen|an|D;sich erkundigen|nach|D|bei;erwarten|von|D;erziehen|zu|D;experimentieren|mit|D;fragen|nach|D;führen|zu|D;gehören|zu|D`,RN=`die Aktion|für|A|gegen;die Angst|vor|AD|um;die Anregung|für|A;die Antwort|auf|A;der Ärger|über|A;das Argument|für|A|gegen;die Aussicht|auf|A;die Auswirkung|auf|A;die Begeisterung|für|A;die Begründung|für|A;die Bemühung|um|A;die Chance|auf|A;der Dank|für|A;die Diskussion|über|A;der Einfluss|auf|A;das Engagement|für|A|gegen;die Entscheidung|für|A|gegen;die Freude (Zukunft)|auf|A;die Freude (Gegenwart)|über|A;das Gespräch|über|AD|mit;die Gewöhnung|an|A;der Grund|für|A|gegen;die Hoffnung|auf|A;die Information|über|AD|zu;das Interesse|für|AD|an;die Konzentration|auf|A;die Reaktion|auf|A;das Recht|auf|A;die Ursache|für|A;die Verantwortung|für|A;der Verzicht|auf|A;die Voraussetzung|für|A;die Vorbereitung|auf|A;die Abhängigkeit|von|D;die Alternative|zu|D;die Änderung|an|D;die Anerkennung|von|D;die Arbeit|an|D;die Auseinandersetzung|mit|D;die Auswahl|an|D;die Beschäftigung|mit|D;die Beteiligung|an|D;der Entschluss|zu|D;die Erfahrung|mit|D;der Erfolg|in|D;die Furcht|vor|D;der Respekt|vor|D;der Schutz|vor|D;die Suche|nach|D;die Teilnahme|an|D;die Trennung|von|D;der Umgang|mit|D;die Verabredung|mit|D`,RA=`allergisch|auf|A|gegen;angewiesen|auf|A;bekannt|für|A;dankbar|für|A;erstaunt|über|A;froh|über|A;geeignet|für|A;gewöhnt|an|A;glücklich|über|A;informiert|über|A;spezialisiert|auf|A;stolz|auf|A;traurig|über|A;überrascht|über|AD|von;verantwortlich|für|A;verärgert|über|A;vorbereitet|auf|A;wichtig|für|A;zuständig|für|A;abhängig|von|D;alternativ|zu|D;arm / reich|an|D;ausgehend|von|D;begeistert|von|D;bereit|zu|D;beschäftigt|mit|D;beteiligt|an|D;betroffen|von|D;einverstanden|mit|D;entschlossen|zu|D;enttäuscht|von|D;erfahren|in|D;fähig|zu|D;interessiert|an|D;überzeugt|von|D;unabhängig|von|D;verbunden|mit|D;verwandt|mit|D;vorsichtig|mit|D|bei;zufrieden|mit|D`;
const parse=(r,t)=>r.split(";").map(s=>{const a=s.split("|");return{t,v:a[0],p:a[1],c:a[2],alt:a[3]?a[3].split(","):[]}});
const V=[...parse(RV,"V")];
const key=x=>x.t+x.v+x.p;
const TYPES={V:"Verb",N:"Nomen",A:"Adjektiv"};
const CASES={A:"Akkusativ",D:"Dativ",AD:"Akk./Dat."};
const PREPS=[...new Set(V.map(x=>x.p))];
const EXAMPLES={"achten": "Ich achte auf die Regeln.", "ankommen": "Es kommt auf die Details an.", "sich anpassen": "Ich passe mich an die neue Situation an.", "antworten": "Ich antworte auf die E-Mail.", "sich ärgern": "Ich ärgere mich über den Lärm.", "aufpassen": "Bitte pass auf die Kinder auf.", "ausgeben": "Ich gebe Geld für Bücher aus.", "sich bedanken": "Ich bedanke mich bei dir für deine Hilfe.", "sich begeistern": "Sie begeistert sich für moderne Kunst.", "sich beklagen": "Er beklagt sich über das Wetter.", "berichten": "Die Zeitung berichtet über den Unfall.", "sich beschweren": "Der Kunde beschwert sich bei der Firma über den Service.", "sich bewerben": "Ich bewerbe mich bei der Firma um eine Stelle.", "sich beziehen": "Die Frage bezieht sich auf den letzten Satz.", "bitten": "Ich bitte dich um Hilfe.", "danken": "Ich danke dir für deine Hilfe.", "denken": "Ich denke an meine Familie.", "diskutieren": "Wir diskutieren über das Problem.", "eingehen": "Der Text geht auf dieses Problem ein.", "sich einigen": "Wir einigen uns auf einen Termin.", "sich einsetzen": "Sie setzt sich für die Umwelt ein.", "sich engagieren": "Er engagiert sich für soziale Projekte.", "sich entscheiden": "Ich entscheide mich für den blauen Pullover.", "sich entschuldigen": "Ich entschuldige mich bei dir für meinen Fehler.", "(sich) erinnern": "Ich erinnere mich an den Urlaub.", "erzählen": "Er erzählt mir von seiner Reise.", "sich freuen (Zukunft)": "Ich freue mich auf das Wochenende.", "sich freuen (Gegenwart)": "Ich freue mich über das Geschenk.", "sich gewöhnen": "Ich gewöhne mich an das neue Leben.", "glauben": "Ich glaube an dich.", "halten": "Ich halte ihn für einen guten Lehrer.", "sich halten": "Bitte halte dich an die Regeln.", "es handelt sich": "Es handelt sich um ein Missverständnis.", "hinweisen": "Ich weise auf einen Fehler hin.", "hoffen": "Wir hoffen auf gutes Wetter.", "(sich) informieren": "Ich informiere mich über das Angebot.", "sich interessieren": "Ich interessiere mich für Geschichte.", "investieren": "Wir investieren in neue Technik.", "kämpfen": "Sie kämpft für ihre Rechte.", "sich konzentrieren": "Ich konzentriere mich auf die Aufgabe.", "sich kümmern": "Ich kümmere mich um die Kinder.", "lachen": "Wir lachen über den Witz.", "nachdenken": "Ich denke über die Frage nach.", "reagieren": "Er reagiert auf die Nachricht.", "reden": "Wir reden über das Problem.", "schimpfen": "Er schimpft über den Verkehr.", "sorgen": "Meine Eltern sorgen für mich.", "sich sorgen": "Sie sorgt sich um ihre Tochter.", "sich spezialisieren": "Die Firma spezialisiert sich auf Software.", "sprechen": "Wir sprechen über das Projekt.", "speichern": "Ich speichere die Datei auf dem Computer.", "(sich) streiten": "Die Kinder streiten sich über das Spiel.", "sich unterhalten": "Wir unterhalten uns über den Film.", "sich verlassen": "Ich verlasse mich auf dich.", "sich verlieben": "Er hat sich in sie verliebt.", "verzichten": "Ich verzichte auf Süßigkeiten.", "sich vorbereiten": "Ich bereite mich auf die Prüfung vor.", "warten": "Ich warte auf den Bus.", "sich wenden": "Bitte wenden Sie sich an das Sekretariat.", "werben": "Die Firma wirbt für ihr neues Produkt.", "sich wundern": "Ich wundere mich über seine Reaktion.", "gratulieren": "Ich gratuliere dir zu deinem Erfolg.", "handeln": "Der Text handelt von einer Reise.", "helfen": "Ich helfe dir bei der Arbeit.", "hören": "Ich habe lange nichts von ihm gehört.", "klarkommen": "Ich komme gut mit meinen Kollegen klar.", "klingen": "Das klingt nach einem guten Plan.", "leiden": "Er leidet an einer Krankheit.", "liegen": "Das liegt an der schlechten Vorbereitung.", "sich melden": "Ich melde mich bei dir morgen.", "motivieren": "Der Lehrer motiviert die Schüler zu mehr Leistung.", "nachfragen": "Ich frage beim Lehrer nach.", "sich orientieren": "Ich orientiere mich an diesem Beispiel.", "passen": "Der Termin passt zu meinem Plan.", "raten": "Ich rate dir zu einer Pause.", "(sich) retten": "Er rettet sich vor dem Hund.", "sich richten": "Wir richten uns nach den Regeln.", "schmecken": "Die Suppe schmeckt nach Knoblauch.", "sterben": "Viele Menschen sterben an dieser Krankheit.", "teilnehmen": "Ich nehme an dem Kurs teil.", "telefonieren": "Ich telefoniere mit meiner Mutter.", "träumen": "Ich träume von einem Urlaub.", "sich treffen": "Ich treffe mich mit meinen Freunden.", "(sich) trennen": "Sie trennt sich von ihrem Freund.", "überreden": "Er überredet mich zu einem Spaziergang.", "überzeugen": "Sie überzeugt mich von ihrer Idee.", "umgehen": "Ich kann gut mit Stress umgehen.", "unterbrechen": "Bitte unterbrich mich nicht bei der Arbeit.", "sich unterscheiden": "Die beiden Wörter unterscheiden sich voneinander.", "unterstützen": "Meine Kollegen unterstützen mich bei der Arbeit.", "sich verabreden": "Wir verabreden uns mit Freunden.", "sich verabschieden": "Ich verabschiede mich von meinen Kollegen.", "verbinden": "Ich verbinde das Kabel mit dem Computer.", "vergleichen": "Ich vergleiche das Produkt mit einem anderen.", "verlangen": "Der Chef verlangt viel von seinen Mitarbeitern.", "(sich) verstecken": "Das Kind versteckt sich vor dem Hund.", "sich verstehen": "Ich verstehe mich gut mit meinen Nachbarn.", "vorbeikommen": "Ich komme morgen bei dir vorbei.", "vorkommen": "Das kommt bei Kindern häufig vor.", "vortragen": "Die Studentin trägt das Referat vor der Klasse vor.", "weglaufen": "Der Hund läuft vor dem Mann weg.", "sich wünschen": "Ich wünsche mir mehr Zeit von dir.", "zurückkommen": "Ich komme morgen von Berlin zurück.", "zählen": "Diese Aufgabe zählt zu meinen Pflichten.", "zweifeln": "Ich zweifle an seiner Aussage.", "zwingen": "Niemand kann mich zu etwas zwingen.", "abhalten": "Das schlechte Wetter hält uns von der Reise ab.", "abhängen": "Das hängt von der Situation ab.", "sich abmelden": "Ich melde mich von dem Kurs ab.", "abraten": "Der Arzt rät mir von dieser Reise ab.", "ändern": "Wir müssen etwas an dem Plan ändern.", "anfangen": "Ich fange mit der Arbeit an.", "anrufen": "Ich rufe beim Arzt an.", "arbeiten": "Ich arbeite an einem neuen Projekt.", "aufhören": "Ich höre mit dem Rauchen auf.", "ausgehen": "Wir gehen von einem guten Ergebnis aus.", "sich auskennen": "Ich kenne mich mit Computern gut aus.", "sich austauschen": "Wir tauschen uns mit Kollegen aus.", "sich befassen": "Ich befasse mich mit deutscher Grammatik.", "sich befinden": "Das Hotel befindet sich in der Stadt.", "beginnen": "Wir beginnen mit der Arbeit.", "beitragen": "Diese Maßnahme trägt zu einer Lösung bei.", "bestehen": "Der Tisch besteht aus Holz.", "bestellen": "Ich bestelle das Essen bei einem Lieferdienst.", "sich beteiligen": "Viele Schüler beteiligen sich an der Diskussion.", "bringen": "Die Übung bringt mich zu einer neuen Idee.", "einladen": "Ich lade dich zu meiner Party ein.", "sich entschließen": "Wir entschließen uns zu einem neuen Plan.", "erhalten": "Ich habe eine Antwort von der Firma erhalten.", "sich erholen": "Ich erhole mich von der Reise.", "erkennen": "Ich erkenne ihn an seiner Stimme.", "sich erkundigen": "Ich erkundige mich bei der Firma nach dem Preis.", "erwarten": "Wir erwarten viel von ihm.", "erziehen": "Eltern erziehen ihre Kinder zu selbstständigen Menschen.", "experimentieren": "Die Schüler experimentieren mit verschiedenen Materialien.", "fragen": "Ich frage nach dem Weg.", "führen": "Diese Straße führt zu einem kleinen Dorf.", "gehören": "Dieses Buch gehört zu meiner Sammlung."};
const KEY="verb-praep-v2";
let S={xp:0,streak:0,last:"",prog:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const day=d=>d.toISOString().slice(0,10);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode="all",deck=[],idx=0,cur=null,answered=false;

function pool(){
  const t=$("typ").value;const base=t==="all"?V:V.filter(x=>x.t===t);
  if(mode==="bad"){const b=base.filter(x=>(S.prog[key(x)]||{}).bad);if(b.length)return b}
  return base;
}
function buildDeck(){deck=shuffle(pool());idx=0}
function stats(){
  $("xp").textContent=S.xp;$("streak").textContent=S.streak;$("total").textContent=pool().length;
  let n=0,l=0,m=0;
  V.forEach(x=>{const p=S.prog[key(x)];const o=p?p.ok:0;if(!o)n++;else if(o<3)l++;else m++});
  $("sNew").textContent="Neu "+n;$("sLearn").textContent="Gelernt "+l;$("sMast").textContent="Gemeistert "+m;
}
function show(){
  if(idx>=deck.length)buildDeck();
  cur=deck[idx];answered=false;
  const wrong=shuffle(PREPS.filter(p=>p!==cur.p&&!cur.alt.includes(p))).slice(0,3);
  $("lab").textContent="KARTE "+(idx+1)+"/"+deck.length+" · VERB";
  $("verb").textContent=cur.v;
  $("blank").innerHTML="&nbsp;";
  $("hint").textContent="";$("example").textContent="";$("fb").textContent="";
  $("next").disabled=true;
  const o=$("opts");o.innerHTML="";
  shuffle([cur.p,...wrong]).forEach(p=>{
    const b=document.createElement("button");b.textContent=p;b.onclick=()=>pick(b,p);o.appendChild(b);
  });
  stats();
}
function pick(btn,p){
  if(answered)return;answered=true;
  const k=key(cur);const pr=S.prog[k]||(S.prog[k]={ok:0,bad:false});
  const good=p===cur.p||cur.alt.includes(p);
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===cur.p)b.classList.add("ok")});
  const t=day(new Date());
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===day(y)?S.streak+1:1;S.last=t}
  if(good){pr.ok++;pr.bad=false;S.xp+=10;$("fb").textContent="✓ Richtig! +10 XP"}
  else{btn.classList.add("bad");pr.bad=true;pr.ok=Math.max(0,pr.ok-1);$("fb").textContent="✗ Richtig ist: "+[cur.p,...cur.alt].join(" / ")}
  $("blank").textContent=cur.p;
  $("hint").textContent=cur.v.replace(/\s*\(.*\)/,"")+" "+[cur.p,...cur.alt].join("/")+" + "+CASES[cur.c];
  $("example").textContent=EXAMPLES[cur.v]||"Beispiel: "+cur.v+" "+cur.p+" …";
  $("next").disabled=false;$("next").focus();
  save();stats();
}
$("next").onclick=()=>{idx++;show()};
function setMode(m){mode=m;$("tAll").classList.toggle("on",m==="all");$("tBad").classList.toggle("on",m==="bad");buildDeck();show()}
$("tAll").onclick=()=>setMode("all");
$("tBad").onclick=()=>setMode("bad");
